<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Engineer AI Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"         rel="stylesheet">
    <link rel="stylesheet" href="/style/AIchatbot.css">
</head>

<body>
    <section class="AIbotchatModal">

        <!-- YOUR WEBSITE -->
        <div class="demo-page">
            <div class="demo-glow"></div>
            <h2>🚀 Tech Engineer AI</h2>
            <p>AI & IT Training | IT Services & Automation</p>
            <p class="mt-3 text-muted">👉 Click the chat icon to talk with our AI</p>
        </div>

        <!-- FLOATING BUTTON -->
        <button class="chat-toggle-btn" id="chatToggle" onclick="toggleChat()">
            <div class="btn-ripple"></div>
            <div class="btn-ripple delay"></div>
            <span class="icon-chat"><i class="bi bi-chat-dots-fill"></i></span>
            <span class="icon-close"><i class="bi bi-x-lg"></i></span>
            <span class="chat-badge" id="chatBadge"></span>
        </button>

        <!-- CHAT WINDOW -->
        <div class="chat-window" id="chatWindow">

            <!-- LEAD FORM -->
            <div id="leadForm" class="lead-card">
                <button class="form-close-btn" onclick="toggleChat()">
                    <i class="bi bi-x-lg"></i>
                </button>

                <!-- Decorative orbs -->
                <div class="orb orb-1"></div>
                <div class="orb orb-2"></div>

                <div class="logo-area">
                    <div class="icon-circle">
                        <div class="icon-ring"></div>
                        <i class="bi bi-robot"></i>
                    </div>
                    <h3>Tech Engineer AI</h3>
                    <p>Enter your details to start chatting</p>
                </div>

                <div class="form-group-custom">
                    <div class="input-wrapper">
                        <i class="bi bi-person-fill input-icon"></i>
                        <input type="text" class="custom-input" id="userName" placeholder=" " required>
                        <label class="custom-label">Your Name</label>
                        <div class="input-line"></div>
                    </div>
                    <span class="error-text" id="nameError"></span>
                </div>

                <div class="form-group-custom">
                    <div class="input-wrapper">
                        <i class="bi bi-envelope-fill input-icon"></i>
                        <input type="email" class="custom-input" id="userEmail" placeholder=" " required>
                        <label class="custom-label">Your Email</label>
                        <div class="input-line"></div>
                    </div>
                    <span class="error-text" id="emailError"></span>
                </div>

                <div class="form-group-custom">
                    <div class="input-wrapper">
                        <i class="bi bi-whatsapp input-icon"></i>
                        <input type="tel" class="custom-input" id="userPhone" placeholder=" " required
                            maxlength="15">
                        <label class="custom-label">WhatsApp Number</label>
                        <div class="input-line"></div>
                    </div>
                    <span class="error-text" id="phoneError"></span>
                </div>

                <div class="form-group-custom">
                    <div class="input-wrapper select-wrapper">
                        <i class="bi bi-grid-fill input-icon"></i>
                        <select class="custom-input custom-select" id="userCategory">
                            <option value="training">AI & IT Training</option>
                            <option value="service">IT Services & Automation</option>
                        </select>
                        <label class="custom-label active-label">I'm interested in</label>
                        <div class="input-line"></div>
                    </div>
                </div>

                <button class="btn-start" id="btnStart" onclick="validateAndSubmit()">
                    <span class="btn-text">
                        <i class="bi bi-chat-dots me-2"></i> Start Chatting
                    </span>
                    <span class="btn-loader" style="display:none;">
                        <span class="spinner"></span> Connecting...
                    </span>
                    <div class="btn-shine"></div>
                </button>

                <div class="form-footer">
                    <i class="bi bi-shield-lock-fill"></i> Your data is secure & encrypted
                </div>
            </div>

            <!-- CHAT INTERFACE -->
            <div id="chatInterface" class="chat-card" style="display:none;">
                <div class="chat-header">
                    <div class="header-bg-anim"></div>
                    <div class="avatar">
                        <div class="avatar-pulse"></div>
                        <i class="bi bi-robot"></i>
                    </div>
                    <div class="info">
                        <h5>Tech Engineer AI</h5>
                        <small><span class="status-dot"></span> Online — ready to help</small>
                    </div>
                    <button class="chat-close-btn" onclick="toggleChat()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <div class="chat-messages" id="chatMessages"></div>

                <div class="quick-actions" id="quickActions"></div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type your question..."
                        onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn-send" id="btnSend" onclick="sendMessage()">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/script/aichatbot.js"></script>

     <script>
        // ============ FORM VALIDATION ============
        function validateAndSubmit() {
            let valid = true;

            const name = document.getElementById('userName');
            const email = document.getElementById('userEmail');
            const phone = document.getElementById('userPhone');

            // Clear errors
            clearError('nameError', name);
            clearError('emailError', email);
            clearError('phoneError', phone);

            // Name validation
            if (name.value.trim() === '') {
                showError('nameError', name, 'Name is required');
                valid = false;
            } else if (name.value.trim().length < 2) {
                showError('nameError', name, 'Name must be at least 2 characters');
                valid = false;
            } else if (!/^[a-zA-Z\s]+$/.test(name.value.trim())) {
                showError('nameError', name, 'Name can only contain letters');
                valid = false;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email.value.trim() === '') {
                showError('emailError', email, 'Email is required');
                valid = false;
            } else if (!emailRegex.test(email.value.trim())) {
                showError('emailError', email, 'Enter a valid email address');
                valid = false;
            }

            // Phone validation — ONLY numbers allowed
            const phoneVal = phone.value.trim();
            if (phoneVal === '') {
                showError('phoneError', phone, 'WhatsApp number is required');
                valid = false;
            } else if (!/^\d+$/.test(phoneVal)) {
                showError('phoneError', phone, '❌ Only numbers allowed (e.g. 9876543210)');
                valid = false;
            } else if (phoneVal.length < 10) {
                showError('phoneError', phone, 'Enter at least 10 digits');
                valid = false;
            }

            if (valid) {
                submitLead(); // Call YOUR existing JS function
            } else {
                // Shake animation on button
                const btn = document.getElementById('btnStart');
                btn.classList.add('shake');
                setTimeout(() => btn.classList.remove('shake'), 600);
            }
        }

        function showError(id, input, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            input.closest('.input-wrapper').classList.add('has-error');
        }

        function clearError(id, input) {
            const el = document.getElementById(id);
            el.textContent = '';
            el.style.display = 'none';
            input.closest('.input-wrapper').classList.remove('has-error');
        }

        // Real-time phone filtering — block non-numbers while typing
        document.getElementById('userPhone').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9+]/g, '');
            if (this.value.length > 0) {
                clearError('phoneError', this);
            }
        });

        // Real-time clear errors on typing
        document.getElementById('userName').addEventListener('input', function () {
            if (this.value.trim().length >= 2) clearError('nameError', this);
        });

        document.getElementById('userEmail').addEventListener('input', function () {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailRegex.test(this.value.trim())) clearError('emailError', this);
        });
    </script>
</body>

</html>
